changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: "Breaking changes"
      labels: [breaking]
    - title: "Features"
      labels: [feature, enhancement]
    - title: "Fixes"
      labels: [bug, fix]
    - title: "Security"
      labels: [security]
    - title: "Documentation & maintenance"
      labels: [docs, chore, dependencies]
    - title: "Other changes"
      labels: ["*"]
