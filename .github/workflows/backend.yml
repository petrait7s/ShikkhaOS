name: Backend

# Rust backend: fmt, clippy, tests (Postgres+Redis), migration validation, SQLx offline cache,
# dependency audits, production Linux binary, Docker image.
# Callable from release.yml.

on:
  pull_request:
    paths: ["apps/api/**", "database/**", "infrastructure/docker/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["apps/api/**", "database/**", "infrastructure/docker/**", ".github/workflows/backend.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: ""
      release:
        type: boolean
        default: false
      push_image:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/shikkhaos_ci
  REDIS_URL: redis://localhost:6379
  SQLX_CLI_VERSION: "0.8.2"

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.d.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          if [ -f apps/api/Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.release }}" = "true" ]; then echo "::error::Release requires apps/api/Cargo.toml"; exit 1
          else echo "::notice::No Rust backend yet; skipped"; echo "present=false" >> "$GITHUB_OUTPUT"; fi

  test:
    name: Lint, test, migrations
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shikkhaos_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable        # apps/api/rust-toolchain.toml pins the exact toolchain
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
      - name: Cache sqlx-cli
        id: sqlx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqlx
          key: sqlx-cli-${{ runner.os }}-${{ env.SQLX_CLI_VERSION }}
      - name: Install sqlx-cli
        if: steps.sqlx-cache.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --version "$SQLX_CLI_VERSION" --locked --no-default-features --features rustls,postgres
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-audit
      - name: Validate migrations on an empty database
        working-directory: .
        run: |
          sqlx migrate run --source database/migrations
          sqlx migrate info --source database/migrations
          echo "Re-running must be a no-op:"
          sqlx migrate run --source database/migrations
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: SQLx offline cache is up to date
        run: cargo sqlx prepare --workspace --check -- --all-targets
      - name: Build without a database (offline mode)
        env:
          SQLX_OFFLINE: "true"
        run: cargo check --workspace --all-targets --locked
      - name: Tests
        run: cargo nextest run --workspace --locked --profile ci
      - name: Dependency policy (licenses, bans, advisories)
        run: cargo deny check
      - name: RustSec advisories
        run: cargo audit

  binary:
    name: Linux release binary
    needs: [detect, test]
    if: needs.detect.outputs.present == 'true' && (inputs.release || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04      # older glibc => wider runtime compatibility
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
      - name: Compute version
        id: v
        working-directory: .
        run: |
          V="${{ inputs.version }}"
          [ -n "$V" ] || V="0.0.0-ci.${{ github.run_number }}+${GITHUB_SHA::7}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"
      - name: Build (locked, offline SQLx, reproducible flags)
        env:
          SQLX_OFFLINE: "true"
          SHIKKHAOS_VERSION: ${{ steps.v.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.v.outputs.epoch }}
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/src -C strip=symbols"
        run: cargo build --release --locked --bin shikkhaos-api
      - name: Smoke test binary
        run: ./target/release/shikkhaos-api --version
      - name: Package
        working-directory: .
        env:
          V: ${{ steps.v.outputs.version }}
          EPOCH: ${{ steps.v.outputs.epoch }}
        run: |
          name="shikkhaos-api-${V//+/_}-x86_64-linux"
          mkdir -p "dist/$name"
          cp apps/api/target/release/shikkhaos-api "dist/$name/"
          cp -r database/migrations "dist/$name/migrations"
          cp -r infrastructure/docker "dist/$name/docker" 2>/dev/null || true
          [ -f LICENSE ] && cp LICENSE "dist/$name/" || true
          tar --sort=name --mtime="@${EPOCH}" --owner=0 --group=0 --numeric-owner \
              -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: backend-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  docker:
    name: Docker image
    needs: [detect, test]
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ inputs.push_image == true || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR requires lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.release && !contains(inputs.version, '-') }}
            type=edge,branch=main
            type=sha,format=short
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: ${{ env.PUSH == 'true' }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: docker run --rm "$(echo '${{ steps.meta.outputs.tags }}' | head -n1)" shikkhaos-api --version
