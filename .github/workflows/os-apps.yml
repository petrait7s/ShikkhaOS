name: OS apps (demo installers)

# Builds the full OS-style interface with built-in DEMO data (no server needed):
# Windows installer + portable .exe, Linux AppImage and Fedora/RHEL .rpm, Android .apk (debug-signed, for sideloading).
# Run it by hand: Actions -> "OS apps (demo installers)" -> Run workflow, then download the artifacts of the run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows (.exe), os: windows-latest, artifact: os-desktop-windows, files: "os-shell/desktop/dist/*.exe" }
          - { name: Linux (AppImage + rpm), os: ubuntu-latest, artifact: os-desktop-linux, files: "os-shell/desktop/dist/*.AppImage\nos-shell/desktop/dist/*.rpm" }
    defaults:
      run:
        shell: bash
        working-directory: os-shell
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install rpm tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build the web app (demo data, no API)
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm build
          test -f out/login/index.html
      - name: Package the desktop app
        working-directory: os-shell/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm install --ignore-workspace
          pnpm dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the web app (demo data, no API)
        working-directory: os-shell
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm build
          test -f out/login/index.html
      - name: Create the Android project and build a debug APK
        working-directory: os-shell/mobile
        run: |
          pnpm install --ignore-workspace
          pnpm exec cap add android
          pnpm exec cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../../apk
          cp app/build/outputs/apk/debug/app-debug.apk ../../apk/ShikkaOS-demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: os-android
          path: os-shell/apk/ShikkaOS-demo.apk
          if-no-files-found: error
          retention-days: 30
