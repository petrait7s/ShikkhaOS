[package]
name = "shikkhaos-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "shikkhaos_app"
path = "src/lib.rs"

[[bin]]
name = "shikkhaos-api"
path = "src/main.rs"

[dependencies]
shikkhaos-domain = { path = "../domain" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "timeout", "limit", "set-header", "compression-gzip"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "rust_decimal", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-float", "db-postgres"] }
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures-util = "0.3"

[dev-dependencies]
http-body-util = "0.1"

[dev-dependencies.tower]
version = "0.5"
features = ["util"]
