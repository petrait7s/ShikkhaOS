[advisories]
version = 2
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0459"]  # lock-file-only (unused sqlx drivers); see .cargo/audit.toml

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "OpenSSL", "BSL-1.0", "CDLA-Permissive-2.0"]
# first-party crates are UNLICENSED
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
